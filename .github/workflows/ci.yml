# Adamachines 3D: build the game, race the AI round every track and replay it
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GNAT, gprbuild, GtkAda, libepoxy and PulseAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild libgtkada20-dev libgtk-3-dev libepoxy-dev libpulse-dev

      - name: Build the game
        run: make

      - name: Race and replay every track (make test)
        run: make test
